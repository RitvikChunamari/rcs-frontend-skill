name: Feature request
description: Propose a focused improvement to the design or engineering workflow
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What real agent task would this improve?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Current gap
      description: What is missing or unreliable today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Include credible public references and licensing considerations when relevant.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should maintainers test that this improves the skill?
    validations:
      required: true
