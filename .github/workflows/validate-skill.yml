name: Validate agent skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run skill checks
        run: python scripts/validate_skill.py
      - name: Run script tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compile Python
        run: python -m compileall -q scripts
